name: Merge OpenAPI Specs

on:
  push:
    paths:
      - 'services/api-gateway/openapi/**'
      - 'services/api-gateway/scripts/merge-openapi.mjs'
      - 'services/api-gateway/src/openapi/**'
      - '.github/workflows/openapi-merge.yml'
  workflow_dispatch:

jobs:
  merge-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Merge service specs
        run: npm run openapi:merge

      - name: Validate generated spec is committed
        run: git diff --exit-code -- openapi/generated/combined.openapi.json

      - name: Upload combined spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-openapi-spec
          path: services/api-gateway/openapi/generated/combined.openapi.json
