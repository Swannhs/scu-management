services:
  traefik:
    image: traefik:v3.1
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "8088:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - edge-auth-service
      - user-service
      - course-service
      - assessment-service
      - attendance-service
      - grades-service
      - enrollment-service
      - student-portal
      - faculty-portal
      - campus-social-service
      - document-service
    networks:
      - ums-network

  edge-auth-service:
    build: ../services/edge-auth-service
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
    networks:
      - ums-network

  student-portal:
    build: ../apps/student-portal
    depends_on:
      - user-service
      - enrollment-service
      - attendance-service
      - grades-service
    networks:
      - ums-network

  faculty-portal:
    build: ../apps/faculty-portal
    depends_on:
      - user-service
      - course-service
      - attendance-service
      - grades-service
    networks:
      - ums-network

  # Infrastructure Services
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: start-dev --http-port=8080 --hostname-url=http://localhost:8080 --hostname-strict=false --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloakpass}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - ums-network

  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloakpass}
    networks:
      - ums-network
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ums-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ums-network

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    networks:
      - ums-network
    volumes:
      - mongo_data:/data/db

  # Shared Database for Microservices (Optimized for Dev)
  # We use one Postgres instance but logically separate DBs would be better.
  # For simplicity in this setup, we will use one postgres instance and create multiple DBs via init script if possible.
  # But the guide lists separate DB containers. I will follow the guide to stick to the "microservices" purity.
  # Warning: This uses a lot of memory.


  social-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: socialdb
      POSTGRES_USER: ${SOCIAL_DB_USER:-socialuser}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-socialpass}
    networks:
      - ums-network

  grades-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gradesdb
      POSTGRES_USER: ${GRADES_DB_USER:-gradesuser}
      POSTGRES_PASSWORD: ${GRADES_DB_PASSWORD:-gradespass}
    networks:
      - ums-network

  attendance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: attendancedb
      POSTGRES_USER: ${ATTENDANCE_DB_USER:-attendanceuser}
      POSTGRES_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-attendancepass}
    networks:
      - ums-network

  course-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coursedb
      POSTGRES_USER: ${COURSE_DB_USER:-courseuser}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD:-coursepass}
    networks:
      - ums-network

  finance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: ${FINANCE_DB_USER:-financeuser}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:-financepass}
    networks:
      - ums-network

  library-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: ${LIBRARY_DB_USER:-libraryuser}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-librarypass}
    networks:
      - ums-network

  faculty-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: facultydb
      POSTGRES_USER: ${FACULTY_DB_USER:-facultyuser}
      POSTGRES_PASSWORD: ${FACULTY_DB_PASSWORD:-facultypass}
    networks:
      - ums-network

  hostel-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hosteldb
      POSTGRES_USER: ${HOSTEL_DB_USER:-hosteluser}
      POSTGRES_PASSWORD: ${HOSTEL_DB_PASSWORD:-hostelpass}
    networks:
      - ums-network

  parent-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: parentdb
      POSTGRES_USER: ${PARENT_DB_USER:-parentuser}
      POSTGRES_PASSWORD: ${PARENT_DB_PASSWORD:-parentpass}
    networks:
      - ums-network

  admin-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: admindb
      POSTGRES_USER: ${ADMIN_DB_USER:-adminuser}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:-adminpass}
    networks:
      - ums-network

  transport-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: transportdb
      POSTGRES_USER: ${TRANSPORT_DB_USER:-transportuser}
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transportpass}
    networks:
      - ums-network

  enrollment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: enrollmentdb
      POSTGRES_USER: ${ENROLLMENT_DB_USER:-enrollmentuser}
      POSTGRES_PASSWORD: ${ENROLLMENT_DB_PASSWORD:-enrollmentpass}
    networks:
      - ums-network

  user-auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userauthdb
      POSTGRES_USER: ${USER_DB_USER:-userauthuser}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-userauthpass}
    networks:
      - ums-network

  assessment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: assessmentdb
      POSTGRES_USER: ${ASSESSMENT_DB_USER:-assessmentuser}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessmentpass}
    networks:
      - ums-network

  document-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: ${DOCUMENT_DB_USER:-documentuser}
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD:-documentpass}
    networks:
      - ums-network

  # Microservices


  # Legacy social service (non-canonical). Canonical service name is campus-social-service.
  social-service:
    build: ../services/social-service
    profiles: ["legacy-social"]
    depends_on:
      - social-db
      - rabbitmq
    networks:
      - ums-network
    ports:
      - "8011:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=social-db
      - DB_PORT=5432
      - DB_DATABASE=socialdb
      - DB_USERNAME=${SOCIAL_DB_USER:-socialuser}
      - DB_PASSWORD=${SOCIAL_DB_PASSWORD:-socialpass}
      - RABBITMQ_HOST=rabbitmq
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-scu-reverb}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-change-me-in-development}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-change-me-in-development}
      - REVERB_HOST="0.0.0.0"
      - REVERB_PORT=8080
      - REVERB_SCHEME=http


  campus-social-service:
    build: ../services/campus-social-service
    depends_on:
      - mongo
      - rabbitmq
      - keycloak
      - document-service
    networks:
      - ums-network
    ports:
      - "3015:3000"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/campus_social
      - DOCUMENT_SERVICE_URL=http://document-service:3000
      - DOCUMENT_SERVICE_TIMEOUT_MS=10000
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-scu}
      - KEYCLOAK_CLIENT_ID=campus-social-service
      - KEYCLOAK_CLIENT_SECRET=${CAMPUS_SOCIAL_KEYCLOAK_CLIENT_SECRET:-change-me-in-development}

  # Legacy realtime companion for social-service. Canonical realtime stack is campus-social-service.
  social-reverb:
    build: ../services/social-service
    profiles: ["legacy-social"]
    command: php artisan reverb:start
    depends_on:
      - social-service
    networks:
      - ums-network
    ports:
      - "8080:8080"
    environment:
      - REVERB_APP_ID=${REVERB_APP_ID:-scu-reverb}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-change-me-in-development}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-change-me-in-development}
      - REVERB_HOST="0.0.0.0"
      - REVERB_PORT=8080
      - REVERB_SCHEME=http

  grades-service:
    build: ../services/grades-service
    depends_on:
      - grades-db
      - keycloak
    networks:
      - ums-network
    ports:
      - "3002:3000"

  attendance-service:
    build: ../services/attendance-service
    depends_on:
      - attendance-db
    networks:
      - ums-network
    ports:
      - "3003:3000"

  course-service:
    build: ../services/course-service
    depends_on:
      - course-db
      - keycloak
    networks:
      - ums-network
    ports:
      - "3004:3000"
    environment:
      - DATABASE_URL=postgresql://${COURSE_DB_USER:-courseuser}:${COURSE_DB_PASSWORD:-coursepass}@course-db:5432/coursedb
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-scu}
      - KEYCLOAK_CLIENT_ID=course-service
      - KEYCLOAK_CLIENT_SECRET=${COURSE_KEYCLOAK_CLIENT_SECRET:-change-me-in-development}

  finance-service:
    build: ../services/finance-service
    depends_on:
      - finance-db
      - keycloak
      - rabbitmq
    networks:
      - ums-network
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=finance-db
      - DB_DATABASE=financedb
      - DB_USERNAME=${FINANCE_DB_USER:-financeuser}
      - DB_PASSWORD=${FINANCE_DB_PASSWORD:-financepass}
      - SPRING_RABBITMQ_HOST=rabbitmq

  library-service:
    build: ../services/library-service
    depends_on:
      - library-db
    networks:
      - ums-network
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://library-db:5432/librarydb
      - SPRING_DATASOURCE_USERNAME=${LIBRARY_DB_USER:-libraryuser}
      - SPRING_DATASOURCE_PASSWORD=${LIBRARY_DB_PASSWORD:-librarypass}

  notifications-service:
    build: ../services/notifications-service
    depends_on:
      - rabbitmq
    networks:
      - ums-network
    ports:
      - "8001:8000"

  transport-service:
    build: ../services/transport-service
    depends_on:
      - transport-db
    networks:
      - ums-network
    ports:
      - "8002:8000"

  analytics-service:
    build: ../services/analytics-service
    depends_on:
      - mongo
    networks:
      - ums-network
    ports:
      - "8003:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/university_analytics

  faculty-service:
    build: ../services/faculty-service
    depends_on:
      - faculty-db
    networks:
      - ums-network
    ports:
      - "8004:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=faculty-db
      - DB_PORT=5432
      - DB_DATABASE=facultydb
      - DB_USERNAME=${FACULTY_DB_USER:-facultyuser}
      - DB_PASSWORD=${FACULTY_DB_PASSWORD:-facultypass}

  hostel-service:
    build: ../services/hostel-service
    depends_on:
      - hostel-db
    networks:
      - ums-network
    ports:
      - "8005:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=hostel-db
      - DB_PORT=5432
      - DB_DATABASE=hosteldb
      - DB_USERNAME=${HOSTEL_DB_USER:-hosteluser}
      - DB_PASSWORD=${HOSTEL_DB_PASSWORD:-hostelpass}

  parent-portal-service:
    build: ../services/parent-portal-service
    depends_on:
      - parent-db
    networks:
      - ums-network
    ports:
      - "8006:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=parent-db
      - DB_PORT=5432
      - DB_DATABASE=parentdb
      - DB_USERNAME=${PARENT_DB_USER:-parentuser}
      - DB_PASSWORD=${PARENT_DB_PASSWORD:-parentpass}

  admin-config-service:
    build: ../services/admin-config-service
    depends_on:
      - admin-db
    networks:
      - ums-network
    ports:
      - "8007:80"
    environment:
      - DB_HOST=admin-db
      - DB_DATABASE=admindb
      - DB_USERNAME=${ADMIN_DB_USER:-adminuser}
      - DB_PASSWORD=${ADMIN_DB_PASSWORD:-adminpass}

  enrollment-service:
    build: ../services/enrollment-service
    depends_on:
      - enrollment-db
      - keycloak
    networks:
      - ums-network
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=postgresql://${ENROLLMENT_DB_USER:-enrollmentuser}:${ENROLLMENT_DB_PASSWORD:-enrollmentpass}@enrollment-db:5432/enrollmentdb
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-scu}

  user-service:
    build: ../services/user-service
    depends_on:
      - user-auth-db
      - keycloak
    networks:
      - ums-network
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}

  assessment-service:
    build: ../services/assessment-service
    depends_on:
      - assessment-db
      - keycloak
    networks:
      - ums-network
    ports:
      - "3008:3000"
    environment:
      - DATABASE_URL=postgresql://${ASSESSMENT_DB_USER:-assessmentuser}:${ASSESSMENT_DB_PASSWORD:-assessmentpass}@assessment-db:5432/assessmentdb
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-scu}
      - KEYCLOAK_CLIENT_ID=assessment-service
      - KEYCLOAK_CLIENT_SECRET=${ASSESSMENT_KEYCLOAK_CLIENT_SECRET:-change-me-in-development}

  document-service:
    build: ../services/document-service
    depends_on:
      - document-db
    networks:
      - ums-network
    ports:
      - "3006:3000"
    environment:
      - DATABASE_URL=postgresql://${DOCUMENT_DB_USER:-documentuser}:${DOCUMENT_DB_PASSWORD:-documentpass}@document-db:5432/documentdb
      - PORT=3000

  maintenance-service:
    build: ../services/maintenance-service
    networks:
      - ums-network
    ports:
      - "3007:3000"

  audit-logging-service:
    build: ../services/audit-logging-service
    networks:
      - ums-network
    ports:
      - "8009:8000"



  events-service:
    build: ../services/events-service
    depends_on:
      - rabbitmq
    networks:
      - ums-network
    ports:
      - "8012:8000"

  clubs-service:
    build: ../services/clubs-service
    depends_on:
      - events-service
    networks:
      - ums-network
    ports:
      - "8013:8000"

  awards-service:
    build: ../services/awards-service
    networks:
      - ums-network
    ports:
      - "8014:8000"

  platform-admin-service:
    build: ../services/platform-admin-service
    networks:
      - ums-network
    ports:
      - "8015:8000"

networks:
  ums-network:
    driver: bridge

volumes:
  keycloak_db_data:
  mongo_data:
