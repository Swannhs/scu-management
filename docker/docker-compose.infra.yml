# docker-compose.infra.yml
# Infrastructure services only: databases, Keycloak, RabbitMQ, Redis, MongoDB.
# Use this when developing a single service locally and you only need the backing
# infrastructure running, not every application service.
#
# Usage:
#   docker compose -f docker/docker-compose.infra.yml up -d

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: start-dev --http-port=8080 --hostname-url=http://localhost:8080 --hostname-strict=false --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloakpass}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      - keycloak-db
    networks:
      - ums-network

  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloakpass}
    networks:
      - ums-network
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - ums-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ums-network

  mongo:
    image: mongo:6-jammy
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - ums-network
    volumes:
      - mongo_data:/data/db

  social-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: socialdb
      POSTGRES_USER: ${SOCIAL_DB_USER:-socialuser}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-socialpass}
    networks:
      - ums-network

  grades-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gradesdb
      POSTGRES_USER: ${GRADES_DB_USER:-gradesuser}
      POSTGRES_PASSWORD: ${GRADES_DB_PASSWORD:-gradespass}
    networks:
      - ums-network

  attendance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: attendancedb
      POSTGRES_USER: ${ATTENDANCE_DB_USER:-attendanceuser}
      POSTGRES_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-attendancepass}
    networks:
      - ums-network

  course-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coursedb
      POSTGRES_USER: ${COURSE_DB_USER:-courseuser}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD:-coursepass}
    networks:
      - ums-network

  finance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: ${FINANCE_DB_USER:-financeuser}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:-financepass}
    networks:
      - ums-network

  library-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: ${LIBRARY_DB_USER:-libraryuser}
      POSTGRES_PASSWORD: ${LIBRARY_DB_PASSWORD:-librarypass}
    networks:
      - ums-network

  faculty-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: facultydb
      POSTGRES_USER: ${FACULTY_DB_USER:-facultyuser}
      POSTGRES_PASSWORD: ${FACULTY_DB_PASSWORD:-facultypass}
    networks:
      - ums-network

  hostel-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hosteldb
      POSTGRES_USER: ${HOSTEL_DB_USER:-hosteluser}
      POSTGRES_PASSWORD: ${HOSTEL_DB_PASSWORD:-hostelpass}
    networks:
      - ums-network

  parent-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: parentdb
      POSTGRES_USER: ${PARENT_DB_USER:-parentuser}
      POSTGRES_PASSWORD: ${PARENT_DB_PASSWORD:-parentpass}
    networks:
      - ums-network

  admin-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: admindb
      POSTGRES_USER: ${ADMIN_DB_USER:-adminuser}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD:-adminpass}
    networks:
      - ums-network

  transport-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: transportdb
      POSTGRES_USER: ${TRANSPORT_DB_USER:-transportuser}
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transportpass}
    networks:
      - ums-network

  enrollment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: enrollmentdb
      POSTGRES_USER: ${ENROLLMENT_DB_USER:-enrollmentuser}
      POSTGRES_PASSWORD: ${ENROLLMENT_DB_PASSWORD:-enrollmentpass}
    networks:
      - ums-network

  user-auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userauthdb
      POSTGRES_USER: ${USER_DB_USER:-userauthuser}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-userauthpass}
    networks:
      - ums-network

  assessment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: assessmentdb
      POSTGRES_USER: ${ASSESSMENT_DB_USER:-assessmentuser}
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessmentpass}
    networks:
      - ums-network

  document-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: ${DOCUMENT_DB_USER:-documentuser}
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD:-documentpass}
    networks:
      - ums-network

networks:
  ums-network:
    driver: bridge

volumes:
  keycloak_db_data:
  mongo_data:
