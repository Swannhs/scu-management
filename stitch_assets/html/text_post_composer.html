<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Campus Social - Create Post</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        textarea:focus {
            outline: none;
            box-shadow: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col">
<!-- TopAppBar (Suppressed Shell because it's a Transactional Task) -->
<!-- Custom Task Header following JSON TopAppBar styles but tailored for Close/Title/Action -->
<nav class="flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50 bg-surface-container-lowest">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<h1 class="font-headline font-bold tracking-tight text-lg text-on-surface">Create Post</h1>
</div>
<!-- Post Button (Disabled State as Requested) -->
<button class="bg-primary-container text-on-primary-container opacity-50 cursor-not-allowed px-6 py-2 rounded-xl font-body font-semibold text-sm transition-all">
            Post
        </button>
</nav>
<main class="flex-1 flex flex-col px-6">
<!-- User Identity Row -->
<div class="flex items-center gap-3 py-6">
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Alex Johnson" class="w-full h-full object-cover" data-alt="Close up portrait of a young male student" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpbIOE7z7hejVsgry029SU3oyOMBaXX24A0quIoQ3HynwBK3udIUwvQT2XPjU4wk4r4N65RuNa9fDu_z9DSBR4fvimIBG-AMw_A5O9FflE4O0YHP1NMbBVKzW9S7z9_BIzdldDbYI7HmaFprXeg2Q68OBSqcnn0iXdRbMekJrZIMHkYk9xGL8r7YWMFYmOKlxesCyLe-oh8keEtPSKPs7DOcdwACjcgcUbBiPruekuQooQ50ih-2CJZlSv2YiFkgoal2ve3Lx0TU7i"/>
</div>
<div class="flex flex-col">
<span class="font-body font-semibold text-on-surface">Alex Johnson</span>
<!-- Audience Selector Chip -->
<button class="mt-1 flex items-center gap-1.5 px-2.5 py-1 bg-surface-container-low hover:bg-surface-container-high rounded-lg transition-colors border-none group">
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="public">public</span>
<span class="text-[12px] font-medium text-on-surface-variant">Public</span>
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="arrow_drop_down">arrow_drop_down</span>
</button>
</div>
</div>
<!-- Expanded Text Input Area -->
<div class="flex-1 flex flex-col mt-2">
<textarea class="flex-1 w-full bg-transparent border-none p-0 text-xl md:text-2xl text-on-surface placeholder:text-outline font-body resize-none custom-scrollbar leading-relaxed" placeholder="What's on your mind, Alex?" spellcheck="false"></textarea>
</div>
</main>
<!-- Bottom Action Bar (Sticky above "keyboard" area) -->
<footer class="sticky bottom-0 bg-surface-container-lowest border-t border-surface-container-high pb-safe pt-2">
<!-- Floating Style Quick Actions -->
<div class="px-6 py-3 flex items-center justify-between">
<div class="flex items-center gap-1">
<button class="p-3 text-primary-container hover:bg-primary/5 rounded-2xl transition-all group">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<button class="p-3 text-primary-container hover:bg-primary/5 rounded-2xl transition-all group">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
<button class="p-3 text-primary-container hover:bg-primary/5 rounded-2xl transition-all group">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
</button>
<button class="p-3 text-primary-container hover:bg-primary/5 rounded-2xl transition-all group">
<span class="material-symbols-outlined" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</button>
<button class="p-3 text-primary-container hover:bg-primary/5 rounded-2xl transition-all group">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
<!-- Character Counter / Status -->
<div class="hidden sm:block">
<span class="text-xs font-medium text-outline">0 / 2000</span>
</div>
</div>
<!-- Decorative Spacer for Mobile Keyboards -->
<div class="h-2 w-full bg-surface-container-lowest"></div>
</footer>
<!-- Minimalist Sidebar Utility (Hidden on mobile, shown on wider screens for editorial layout) -->
<aside class="hidden lg:fixed lg:right-12 lg:top-32 lg:w-64 lg:flex lg:flex-col lg:gap-8">
<div class="bg-surface-container-low p-6 rounded-2xl">
<h3 class="font-headline font-bold text-sm text-on-surface uppercase tracking-widest mb-4">Post Tips</h3>
<ul class="space-y-4">
<li class="flex gap-3 items-start">
<span class="material-symbols-outlined text-primary-container text-lg" data-icon="auto_awesome">auto_awesome</span>
<p class="text-xs text-on-surface-variant leading-normal">Keep it concise for 20% more engagement on the Feed.</p>
</li>
<li class="flex gap-3 items-start">
<span class="material-symbols-outlined text-primary-container text-lg" data-icon="group">group</span>
<p class="text-xs text-on-surface-variant leading-normal">Tag your study group to notify everyone instantly.</p>
</li>
</ul>
</div>
</aside>
</body></html>
