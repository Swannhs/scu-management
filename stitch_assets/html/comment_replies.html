<body class="bg-surface font-body text-on-surface">

<h1 class="font-['Public_Sans'] font-bold text-lg tracking-tight text-[#00A76F] ml-2">Replies</h1>

<div class="bg-[#f2f4f6] dark:bg-slate-800 h-[1px] w-full max-w-md mx-auto"></div>
</header>
<!-- Main Content Canvas -->

<div class="flex-1 min-w-0">
<div class="flex items-baseline justify-between">
<h3 class="font-semibold text-on-surface text-sm truncate">Alex Rivera</h3>
<span class="text-[10px] text-outline font-medium">2h ago</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 mt-0.5 rounded-full bg-primary/10 text-primary text-[10px] font-bold">
                            STUDENT
                        </div>
</div>
</div>
<div class="mt-3 text-on-surface leading-relaxed text-[15px] font-medium">
                    Does anyone know when the library starts its 24/7 hours for finals week?
                </div>
<div class="mt-4 flex items-center gap-6">
<button class="flex items-center gap-1.5 text-outline hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="favorite">favorite</span>
<span class="text-xs font-semibold">12</span>
</button>
<button class="flex items-center gap-1.5 text-outline hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]" data-icon="chat_bubble">chat_bubble</span>
<span class="text-xs font-semibold">2</span>
</button>
</div>
</div>
</section>
<!-- Reply Thread -->
<div class="relative pl-4 space-y-6">
<!-- Thread Line -->
<div class="absolute left-0 top-0 bottom-0 w-[2px] bg-outline-variant/30 rounded-full ml-4"></div>
<!-- Reply 1 -->
<article class="relative pl-6">
<!-- Connector dot -->
<div class="absolute -left-1.5 top-5 w-3 h-3 rounded-full bg-surface border-2 border-outline-variant/40"></div>
<div class="flex items-start gap-3">
<img alt="Sarah Chen" class="w-8 h-8 rounded-full object-cover" data-alt="Young woman with black hair smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUuWmDj6isZ4wK2CiR0QMVljn5H3Ud-DGTZQLGLeWi-ASiFRqzAR1ckYXaLSUg-Jtdpix4f4mxFnmRWtIUlYPlvVMk8e7OuxUkkXSNY3XDLTQp6-GE-9TbD7_lu6uYaawF3-qTyca8LSrBWbu9ywnuFPfct0NevXUZmRzkbSi6RuG9fPoOB5XhoxV72JsFaLs_4STpGwf92Uz6YdaC5K1n9hMeWb_yNx2YpgFlnoX2BxtlYYaUDS2BAyRx_cHkMX0NkqOQu4rQ4RI_"/>
<div class="flex-1 min-w-0">
<div class="flex items-baseline justify-between">
<div>
<span class="font-semibold text-sm text-on-surface">Sarah Chen</span>
<span class="ml-2 text-[10px] uppercase font-bold text-outline-variant">Student</span>
</div>
<span class="text-[10px] text-outline font-medium">45m ago</span>
</div>
<p class="mt-1 text-on-surface-variant text-sm leading-relaxed">
                            It officially starts this Sunday at midnight! They just posted the schedule this morning.
                        </p>
<div class="mt-2 flex items-center gap-4">
<button class="text-[11px] font-bold text-primary active:scale-95">Like</button>
<button class="text-[11px] font-bold text-outline active:scale-95">Reply</button>
</div>
</div>
</div>
</article>
<!-- Reply 2 -->
<article class="relative pl-6">
<!-- Connector dot -->
<div class="absolute -left-1.5 top-5 w-3 h-3 rounded-full bg-surface border-2 border-outline-variant/40"></div>
<div class="flex items-start gap-3">
<img alt="Marcus Thorne" class="w-8 h-8 rounded-full object-cover" data-alt="Middle-aged man with beard and glasses" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1Dra0T08WeU3jCwkpoZ_ZtqvH2v0-UmG6qSoSAKkFfX8wSJ8ablTs5zpXjnbFL0r1xmVimrAkJMQBZUx3Od8kuay1LDaf2QxI2oRonh6SKsVzRoI1alkfi5yhPT_ebBgUVqHwERv3vfK9eZic917bSYB2iLbA0h6p3rSIMrGqKLhQPLCxvk9kURJURl26XuYS2ubSHH-q33mfmOPil7PMsU28BT_JZEdX52kEdZ0Fl7toBc0zZdFvaQcvx9LSF91_j7hsWh4137N4"/>
<div class="flex-1 min-w-0">
<div class="flex items-baseline justify-between">
<div>
<span class="font-semibold text-sm text-on-surface">Marcus Thorne</span>
<span class="ml-2 text-[10px] uppercase font-bold text-tertiary-container/80">Faculty</span>
</div>
<span class="text-[10px] text-outline font-medium">12m ago</span>
</div>
<p class="mt-1 text-on-surface-variant text-sm leading-relaxed">
                            Thanks for clarifying, Sarah!
                        </p>
<div class="mt-2 flex items-center gap-4">
<button class="text-[11px] font-bold text-primary active:scale-95">Like</button>
<button class="text-[11px] font-bold text-outline active:scale-95">Reply</button>
</div>
</div>
</div>

<div class="absolute right-2 flex items-center gap-1 text-outline">
<button class="p-1 hover:text-primary active:scale-90">
<span class="material-symbols-outlined text-[20px]" data-icon="mood">mood</span>
</button>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-xl bg-gradient-to-br from-primary to-primary-container text-white shadow-lg shadow-primary/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
<div class="max-w-md mx-auto flex gap-2 mt-3 px-12">
<button class="flex items-center gap-1 px-3 py-1 rounded-full bg-surface-container-low text-outline text-[11px] font-bold active:scale-95">
<span class="material-symbols-outlined text-[14px]" data-icon="attachment">attachment</span>
                Attach
            </button>
<button class="flex items-center gap-1 px-3 py-1 rounded-full bg-surface-container-low text-outline text-[11px] font-bold active:scale-95">
<span class="material-symbols-outlined text-[14px]" data-icon="image">image</span>
                Media
            </button>
</div>
</footer>
</body></html>
