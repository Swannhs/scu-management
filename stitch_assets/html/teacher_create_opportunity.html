<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<nav class="bg-white/80 dark:bg-neutral-900/80 backdrop-blur-xl docked full-width top-0 sticky z-50 flex justify-between items-center px-4 py-3 w-full">
<div class="flex items-center gap-3">
<button class="active:scale-95 transition-transform duration-200 hover:opacity-80">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Public_Sans'] font-bold text-lg text-on-surface">Create Opportunity</h1>
</div>
<div class="text-[#00A76F] font-semibold text-sm">Step 1 of 3</div>
</nav>
<div class="bg-[#f2f4f6] dark:bg-neutral-800 h-[1px] w-full"></div>
<main class="px-4 pt-6 max-w-lg mx-auto space-y-6">
<!-- Header Section -->
<header class="mb-8">
<h2 class="text-2xl font-extrabold tracking-tight text-on-surface">New Impact Project</h2>
<p class="text-on-surface-variant text-sm mt-1">Fill in the details to start mobilizing your students.</p>
</header>
<!-- Form Section: Project Info -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-4">
<span class="w-1.5 h-6 bg-primary-container rounded-full"></span>
<h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant">Project Info</h3>
</div>
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Project Title</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline transition-all" placeholder="e.g. Community Garden Cleanup" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Description</label>
<textarea class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline transition-all resize-none" placeholder="Describe the impact and goals..." rows="4"></textarea>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface appearance-none transition-all">
<option>Environment</option>
<option>Education</option>
<option>Social Justice</option>
<option>Animal Welfare</option>
<option>Health &amp; Wellness</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Form Section: Logistics -->
<section class="space-y-4 pt-4">
<div class="flex items-center gap-2 mb-4">
<span class="w-1.5 h-6 bg-primary-container rounded-full"></span>
<h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant">Logistics</h3>
</div>
<div class="grid grid-cols-1 gap-4">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Date &amp; Time</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface transition-all" type="datetime-local"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary-container" data-icon="location_on">location_on</span>
<input class="w-full bg-surface-container-high border-none rounded-xl pl-11 pr-4 py-3.5 text-on-surface placeholder:text-outline transition-all" placeholder="Search address or room number" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Capacity</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface transition-all" placeholder="0" type="number"/>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Service Hours</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface transition-all" placeholder="0" type="number"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Application Deadline</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface transition-all" type="date"/>
</div>
</div>
</section>
<!-- Form Section: Requirements -->
<section class="space-y-4 pt-4">
<div class="flex items-center gap-2 mb-4">
<span class="w-1.5 h-6 bg-primary-container rounded-full"></span>
<h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant">Requirements</h3>
</div>
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-xs font-semibold text-on-surface ml-1">Student Requirements</label>
<textarea class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3.5 text-on-surface placeholder:text-outline transition-all resize-none" placeholder="List any skills, tools, or dress codes required..." rows="3"></textarea>
</div>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col gap-3 pt-6 pb-12">
<button class="w-full bg-gradient-to-tr from-[#006c46] to-[#00a76f] text-white font-bold py-4 rounded-xl shadow-[0_8px_16px_rgba(0,167,111,0.24)] hover:scale-[1.02] active:scale-95 transition-all">
                Publish Opportunity
            </button>
<button class="w-full bg-transparent border border-outline-variant/30 text-on-surface font-semibold py-4 rounded-xl hover:bg-surface-container-low active:scale-95 transition-all">
                Save as Draft
            </button>
</div>

</a>
<a class="flex flex-col items-center justify-center text-[#00A76F] bg-[#00A76F]/10 rounded-xl px-3 py-1 active:scale-90 transition-all duration-200" href="#">

<span class="font-['Public_Sans'] text-[11px] font-semibold tracking-tight">Students</span>
</a>
