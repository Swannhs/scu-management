<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kindred - Chat Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-surface": "#2d3133",
              "on-surface": "#191c1e",
              "secondary-container": "#bceecf",
              "on-primary": "#ffffff",
              "primary": "#006c46",
              "tertiary-fixed-dim": "#ffb3b0",
              "on-secondary-container": "#406e55",
              "surface-container-highest": "#e0e3e5",
              "background": "#f8f9fb",
              "surface-container": "#eceef0",
              "secondary": "#3a674f",
              "inverse-on-surface": "#eff1f3",
              "tertiary-fixed": "#ffdad8",
              "secondary-fixed": "#bceecf",
              "primary-container": "#00a76f",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed-variant": "#842327",
              "on-tertiary-fixed": "#410006",
              "on-error-container": "#93000a",
              "on-tertiary-container": "#5d040f",
              "error": "#ba1a1a",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#ffffff",
              "tertiary": "#a33b3c",
              "surface-tint": "#006c46",
              "outline-variant": "#bccabf",
              "inverse-primary": "#5adda0",
              "on-error": "#ffffff",
              "primary-fixed": "#79fabb",
              "on-primary-fixed-variant": "#005234",
              "surface-container-low": "#f2f4f6",
              "surface": "#f8f9fb",
              "on-secondary-fixed": "#002112",
              "surface-dim": "#d8dadc",
              "primary-fixed-dim": "#5adda0",
              "on-primary-fixed": "#002112",
              "surface-variant": "#e0e3e5",
              "surface-bright": "#f8f9fb",
              "surface-container-high": "#e6e8ea",
              "on-surface-variant": "#3d4a41",
              "on-background": "#191c1e",
              "on-secondary-fixed-variant": "#224f39",
              "outline": "#6d7a71",
              "error-container": "#ffdad6",
              "tertiary-container": "#e66d6c",
              "on-primary-container": "#00321f",
              "secondary-fixed-dim": "#a1d1b4"
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .skeleton-shimmer {
            background: linear-gradient(
                90deg,
                rgba(224, 227, 229, 0.4) 25%,
                rgba(236, 238, 240, 0.8) 50%,
                rgba(224, 227, 229, 0.4) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bubble-left {
            border-bottom-left-radius: 4px;
        }

        .bubble-right {
            border-bottom-right-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-background antialiased overflow-hidden">
<!-- Top Navigation Bar -->
<nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl fixed top-0 w-full z-50 flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<div class="active:scale-98 transition-all duration-200 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full skeleton-shimmer bg-surface-container"></div>
<div class="flex flex-col gap-1.5">
<div class="w-24 h-4 rounded-lg skeleton-shimmer bg-surface-container"></div>
<div class="w-16 h-3 rounded-lg skeleton-shimmer bg-surface-container-low"></div>
</div>
</div>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-slate-400">videocam</span>
<span class="material-symbols-outlined text-slate-400">call</span>
</div>
</nav>
<!-- Content Canvas: Chat Thread -->
<main class="pt-20 pb-24 px-4 h-screen overflow-y-auto space-y-6">
<!-- Date Marker Skeleton -->
<div class="flex justify-center my-8">
<div class="w-20 h-4 rounded-full bg-surface-container-low skeleton-shimmer"></div>
</div>
<!-- Left Aligned Message -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-surface-container skeleton-shimmer shrink-0 mb-1"></div>
<div class="space-y-2 flex flex-col items-start">
<div class="w-48 h-12 bg-surface-container-lowest rounded-[20px] bubble-left shadow-sm skeleton-shimmer"></div>
<div class="w-32 h-3 rounded-lg bg-surface-container-low ml-1"></div>
</div>
</div>
<!-- Right Aligned Message -->
<div class="flex items-end justify-end gap-2 ml-auto max-w-[85%]">
<div class="space-y-2 flex flex-col items-end">
<div class="w-56 h-16 bg-primary-container/20 rounded-[20px] bubble-right skeleton-shimmer"></div>
<div class="w-24 h-3 rounded-lg bg-surface-container-low mr-1"></div>
</div>
</div>
<!-- Left Aligned Group -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-surface-container skeleton-shimmer shrink-0 mb-1"></div>
<div class="space-y-3 flex flex-col items-start">
<div class="w-64 h-20 bg-surface-container-lowest rounded-[20px] bubble-left shadow-sm skeleton-shimmer"></div>
<div class="w-40 h-10 bg-surface-container-lowest rounded-[20px] bubble-left shadow-sm skeleton-shimmer"></div>
</div>
</div>
<!-- Right Aligned Message (Image Placeholder) -->
<div class="flex items-end justify-end gap-2 ml-auto max-w-[85%]">
<div class="space-y-2 flex flex-col items-end">
<div class="w-48 h-48 bg-surface-container-high rounded-[24px] skeleton-shimmer border-4 border-white"></div>
<div class="w-16 h-3 rounded-lg bg-surface-container-low mr-1"></div>
</div>
</div>
<!-- Left Aligned Short Response -->
<div class="flex items-end gap-2 max-w-[85%]">
<div class="w-8 h-8 rounded-full bg-surface-container skeleton-shimmer shrink-0 mb-1"></div>
<div class="space-y-2 flex flex-col items-start">
<div class="w-24 h-10 bg-surface-container-lowest rounded-[20px] bubble-left shadow-sm skeleton-shimmer"></div>
</div>
</div>
<!-- Right Aligned Message -->
<div class="flex items-end justify-end gap-2 ml-auto max-w-[85%]">
<div class="space-y-2 flex flex-col items-end">
<div class="w-64 h-24 bg-primary-container/20 rounded-[20px] bubble-right skeleton-shimmer"></div>
</div>
</div>
</main>
<!-- Bottom Fixed Input Area -->
<footer class="fixed bottom-0 left-0 w-full h-20 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 px-4 flex items-center gap-3 z-50">
<div class="flex items-center justify-center text-slate-400 p-2">
<span class="material-symbols-outlined">add_circle</span>
</div>
<div class="flex-1 h-12 bg-surface-container-high rounded-full flex items-center px-4 gap-3">
<div class="w-32 h-4 rounded-lg bg-surface-container skeleton-shimmer"></div>
<div class="ml-auto text-slate-300">
<span class="material-symbols-outlined">sentiment_satisfied</span>
</div>
</div>
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center text-white shadow-md active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</footer>
<!-- Suppressed Shell Placeholder to respect constraints -->
<div class="hidden">
<nav class="BottomNavBar h-0 overflow-hidden"></nav>
</div>
</body></html>
