<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#e0e3e5",
              "primary-container": "#00a76f",
              "outline": "#6d7a71",
              "primary": "#006c46",
              "on-secondary": "#ffffff",
              "on-error-container": "#93000a",
              "on-tertiary-container": "#5d040f",
              "on-error": "#ffffff",
              "on-secondary-fixed": "#002112",
              "surface-container-highest": "#e0e3e5",
              "background": "#f8f9fb",
              "surface-dim": "#d8dadc",
              "on-surface-variant": "#3d4a41",
              "inverse-on-surface": "#eff1f3",
              "tertiary": "#a33b3c",
              "inverse-primary": "#5adda0",
              "secondary": "#3a674f",
              "on-tertiary-fixed": "#410006",
              "error-container": "#ffdad6",
              "surface-container": "#eceef0",
              "on-tertiary": "#ffffff",
              "on-primary-container": "#00321f",
              "inverse-surface": "#2d3133",
              "on-primary-fixed-variant": "#005234",
              "on-surface": "#191c1e",
              "secondary-fixed-dim": "#a1d1b4",
              "on-background": "#191c1e",
              "secondary-fixed": "#bceecf",
              "on-primary": "#ffffff",
              "secondary-container": "#bceecf",
              "primary-fixed": "#79fabb",
              "outline-variant": "#bccabf",
              "on-secondary-fixed-variant": "#224f39",
              "error": "#ba1a1a",
              "tertiary-fixed": "#ffdad8",
              "surface": "#f8f9fb",
              "primary-fixed-dim": "#5adda0",
              "surface-tint": "#006c46",
              "surface-container-low": "#f2f4f6",
              "on-primary-fixed": "#002112",
              "surface-container-lowest": "#ffffff",
              "surface-bright": "#f8f9fb",
              "on-secondary-container": "#406e55",
              "surface-container-high": "#e6e8ea",
              "tertiary-fixed-dim": "#ffb3b0",
              "on-tertiary-fixed-variant": "#842327",
              "tertiary-container": "#e66d6c"
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.75rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        h1, h2, h3 {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-4 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-slate-500 hover:scale-105 transition-transform duration-200 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-xl font-bold text-[#00A76F] font-['Public_Sans'] tracking-tight">Feed</h1>
</div>
<div class="flex items-center gap-2">
<button class="text-slate-500 hover:scale-105 transition-transform duration-200 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="min-h-screen pt-16 pb-20 flex flex-col items-center justify-center px-6">
<!-- Error State Container -->
<div class="w-full max-w-md flex flex-col items-center text-center">
<!-- Minimal Illustration / Icon -->
<div class="relative mb-12 flex items-center justify-center">
<div class="absolute w-48 h-48 bg-primary-container/5 rounded-full blur-3xl"></div>
<div class="relative w-32 h-32 flex items-center justify-center bg-surface-container-lowest rounded-full shadow-[0_12_32px_rgba(25,28,30,0.04)] border border-outline-variant/10">
<span class="material-symbols-outlined text-6xl text-primary/30" data-icon="cloud_off">cloud_off</span>
<div class="absolute -bottom-2 -right-2 w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="signal_disconnected">signal_disconnected</span>
</div>
</div>
</div>
<!-- Content Area -->
<div class="space-y-4 mb-10">
<h2 class="text-3xl font-extrabold tracking-tight text-on-surface leading-tight font-headline">
                    Something went wrong
                </h2>
<p class="text-on-surface-variant text-base max-w-[280px] mx-auto leading-relaxed font-body">
                    We couldn't load your feed right now. Please check your connection or try again.
                </p>
</div>
<!-- Action Area -->
<button class="group flex items-center justify-center gap-3 bg-gradient-to-br from-primary to-primary-container text-white px-10 py-4 rounded-xl font-semibold shadow-[0_8px_20px_rgba(0,108,70,0.2)] hover:scale-[1.02] active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-xl" data-icon="refresh">refresh</span>
<span class="tracking-wide">Retry</span>
</button>
<!-- Secondary Help Option (Minimalist) -->
<button class="mt-8 text-sm font-medium text-slate-400 hover:text-primary transition-colors">
                Contact support
            </button>
</div>
<!-- Background Decor (Asymmetrical) -->
<div class="fixed top-1/4 -right-16 w-64 h-64 bg-[#00A76F]/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -left-16 w-64 h-64 bg-tertiary/5 rounded-full blur-[100px] pointer-events-none"></div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl flex justify-around items-center px-6 pb-safe z-50 rounded-t-2xl shadow-[0_-4px_16px_rgba(0,0,0,0.04)] border-t border-slate-100 dark:border-slate-800">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-[#00A76F]/10 text-[#00A76F] rounded-xl px-4 py-1 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[10px] font-medium">Home</span>
</a>
<!-- Search -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-['Inter'] text-[10px] font-medium">Search</span>
</a>
<!-- Alerts -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-['Inter'] text-[10px] font-medium">Alerts</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Inter'] text-[10px] font-medium">Profile</span>
</a>
</nav>
</body></html>
