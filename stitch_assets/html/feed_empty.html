<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Campus Social - Feed Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-container": "#00321f",
                        "primary-fixed": "#79fabb",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-container": "#406e55",
                        "surface": "#f8f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "tertiary-container": "#e66d6c",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#3d4a41",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#00a76f",
                        "outline": "#6d7a71",
                        "tertiary-fixed": "#ffdad8",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-fixed": "#002112",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#005234",
                        "on-primary-fixed": "#002112",
                        "secondary-fixed": "#bceecf",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#224f39",
                        "surface-tint": "#006c46",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#5d040f",
                        "inverse-primary": "#5adda0",
                        "secondary-fixed-dim": "#a1d1b4",
                        "outline-variant": "#bccabf",
                        "on-tertiary-fixed": "#410006",
                        "surface-bright": "#f8f9fb",
                        "secondary": "#3a674f",
                        "on-tertiary-fixed-variant": "#842327",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "tertiary": "#a33b3c",
                        "on-primary": "#ffffff",
                        "primary": "#006c46",
                        "background": "#f8f9fb",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "on-surface": "#191c1e",
                        "primary-fixed-dim": "#5adda0",
                        "secondary-container": "#bceecf"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.25rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        .canvas-shadow {
            box-shadow: 0px 12px 32px rgba(25, 28, 30, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline font-black text-xl tracking-tight text-[#00A76F]">Campus Social</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container/20">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a college student smiling" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQWAjrR3WJHpxcvfv2kNcrqmOSNAX4B2KvtQ8Yae_iZtkCJPxIhJJOMfEdUznWtvUs30bMhHwuiU-Bg6HTEJb7bjnE7ya2nFc5uAPGA3MhIDVf87W--HcphU96Ekp3fI7yGO22SFjUB3HNsrqPcgfTw4w7iebecx71kdqdi-sx3HcMjjRcs7LESOf2lFIZ0hNjYC0lx5FGkUDwj8F9D1sQs-iulCSxVe2-dF-zk9WZTeJsQ66xntmlXQahHA_UOdnIrTZEy4UlTUR9"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="min-h-screen pt-16 pb-24 flex flex-col items-center justify-center px-6">
<!-- Asymmetric Background Decorative Element -->
<div class="absolute top-1/4 -right-20 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -z-10"></div>
<div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-secondary-container/10 rounded-full blur-3xl -z-10"></div>
<section class="max-w-md w-full flex flex-col items-center text-center">
<!-- Empty State Illustration Container -->
<div class="relative w-full aspect-square max-w-[280px] mb-12 flex items-center justify-center">
<!-- Tonal Layering for Depth -->
<div class="absolute inset-0 bg-surface-container-lowest rounded-full canvas-shadow"></div>
<div class="absolute inset-4 bg-surface-container-low rounded-full opacity-50"></div>
<!-- Main Illustration (Icon focus) -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-32 h-32 bg-primary-container/10 rounded-3xl flex items-center justify-center transform -rotate-6 transition-transform hover:rotate-0 duration-500">
<span class="material-symbols-outlined text-primary-container !text-7xl" data-icon="school">school</span>
</div>
<div class="absolute -bottom-4 -right-4 w-20 h-20 bg-secondary-container/20 rounded-2xl flex items-center justify-center transform rotate-12 backdrop-blur-sm">
<span class="material-symbols-outlined text-secondary !text-4xl" data-icon="forum">forum</span>
</div>
</div>
</div>
<!-- Content Hierarchy -->
<div class="space-y-4 px-2">
<h2 class="font-headline font-extrabold text-3xl text-on-surface tracking-tight leading-tight">
                    Your feed is quiet
                </h2>
<p class="text-on-surface-variant leading-relaxed text-lg font-medium opacity-80">
                    Be the first to share an update, photo, or event with your campus community.
                </p>
</div>
<!-- CTA Section -->
<div class="mt-12 w-full">
<button class="group relative w-full overflow-hidden bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 px-8 rounded-xl font-bold text-lg shadow-lg shadow-primary-container/20 hover:scale-102 active:scale-98 transition-all duration-200">
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span>Create First Post</span>
</div>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<button class="mt-6 w-full py-3 px-8 text-secondary font-semibold hover:opacity-80 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span>Browse Communities</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-6 pt-3 bg-white/90 dark:bg-slate-950/90 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] rounded-t-2xl">
<!-- Home Tab (Active) -->
<a class="flex flex-col items-center justify-center text-[#00A76F] bg-[#00A76F]/10 rounded-xl px-4 py-1 scale-102 transition-all duration-200" href="#">
<span class="material-symbols-outlined filled-icon" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[11px] font-semibold tracking-wide">Home</span>
</a>
<!-- Discover Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-['Inter'] text-[11px] font-semibold tracking-wide">Discover</span>
</a>
<!-- Alerts Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-['Inter'] text-[11px] font-semibold tracking-wide">Alerts</span>
</a>
<!-- Profile Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 hover:bg-slate-50 dark:hover:bg-slate-900 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Inter'] text-[11px] font-semibold tracking-wide">Profile</span>
</a>
</nav>
<!-- FAB (Suppressed on this specific empty state task-focused screen as per UX guidelines) -->
</body></html>
