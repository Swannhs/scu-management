<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom Skeleton Pulse with Tonal Match */
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .skeleton-shimmer {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: #e6e8ea; /* surface-container-high */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm dark:shadow-none flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full skeleton-shimmer"></div>
<h1 class="text-xl font-black text-slate-900 dark:text-slate-100 font-headline tracking-tight">Editorial</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-slate-500 dark:text-slate-400 hover:opacity-80 transition-opacity active:scale-95 transition-transform">

</button>

<div class="h-3 w-24 bg-surface-container-high rounded-full skeleton-shimmer"></div>

</div>

</div>
<div class="aspect-video w-full bg-surface-container-high rounded-xl skeleton-shimmer"></div>

</article>

<div class="h-3 w-32 bg-surface-container-high rounded-full skeleton-shimmer"></div>

<div class="h-8 w-20 bg-surface-container-high rounded-full skeleton-shimmer"></div>
</div>
</article>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-50">
<!-- Active Home -->
<a class="flex flex-col items-center justify-center text-emerald-600 dark:text-emerald-400 bg-emerald-50/50 dark:bg-emerald-900/20 rounded-xl px-3 py-1 font-inter text-[11px] font-semibold active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span>Home</span>
</a>
<!-- Inactive Explore -->

<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
