<style>
        .skeleton-animate {
            background: linear-gradient(
                90deg,
                #f2f4f6 25%,
                #eceef0 50%,
                #f2f4f6 75%
            );
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00A76F]" data-icon="volunteer_activism">volunteer_activism</span>
<span class="font-headline font-bold tracking-tight text-xl text-[#00A76F]">Kindred</span>
</div>
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full skeleton-animate"></div>
</div>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-md mx-auto">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-10">

<div class="w-32 h-32 rounded-full border-4 border-white shadow-sm skeleton-animate"></div>
<div class="absolute bottom-1 right-1 w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center">
<div class="w-6 h-6 rounded-full skeleton-animate"></div>
</div>
</div>
<!-- Name and Bio Skeletons -->
<div class="w-48 h-8 rounded-lg skeleton-animate mb-3"></div>
<div class="w-64 h-4 rounded-lg skeleton-animate opacity-60 mb-2"></div>
<div class="w-40 h-4 rounded-lg skeleton-animate opacity-40"></div>
</section>
<!-- Metric Cards Bento Grid -->
<section class="grid grid-cols-3 gap-4 mb-10">
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-[0px_12px_32px_rgba(25,28,30,0.04)] flex flex-col items-center">
<div class="w-10 h-8 rounded-lg skeleton-animate mb-2"></div>
<div class="w-12 h-3 rounded-full skeleton-animate opacity-40"></div>
</div>
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-[0px_12px_32px_rgba(25,28,30,0.04)] flex flex-col items-center">
<div class="w-10 h-8 rounded-lg skeleton-animate mb-2"></div>
<div class="w-12 h-3 rounded-full skeleton-animate opacity-40"></div>
</div>
<div class="bg-surface-container-lowest p-4 rounded-xl shadow-[0px_12px_32px_rgba(25,28,30,0.04)] flex flex-col items-center">
<div class="w-10 h-8 rounded-lg skeleton-animate mb-2"></div>
<div class="w-12 h-3 rounded-full skeleton-animate opacity-40"></div>
</div>
</section>
<!-- List Skeleton Section -->
<section class="space-y-4">
<div class="flex items-center justify-between mb-2">
<div class="w-32 h-5 rounded-lg skeleton-animate"></div>
<div class="w-16 h-4 rounded-lg skeleton-animate opacity-40"></div>
</div>
<!-- Skeleton Rows -->
<div class="bg-surface-container-low p-4 rounded-2xl flex items-center gap-4">
<div class="w-12 h-12 rounded-xl skeleton-animate shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="w-3/4 h-4 rounded-lg skeleton-animate"></div>

</div>

</div>
<div class="bg-surface-container-low p-4 rounded-2xl flex items-center gap-4">

<div class="w-2/3 h-4 rounded-lg skeleton-animate"></div>
<div class="w-1/3 h-3 rounded-lg skeleton-animate opacity-50"></div>
</div>
<div class="w-6 h-6 rounded-full skeleton-animate opacity-20"></div>
</div>
<div class="bg-surface-container-low p-4 rounded-2xl flex items-center gap-4 opacity-60">
<div class="w-12 h-12 rounded-xl skeleton-animate shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="w-1/2 h-4 rounded-lg skeleton-animate"></div>
<div class="w-1/4 h-3 rounded-lg skeleton-animate opacity-50"></div>
</div>
<div class="w-6 h-6 rounded-full skeleton-animate opacity-20"></div>
</div>

<div class="w-full h-14 rounded-xl skeleton-animate"></div>
</div>

<nav class="fixed bottom-0 left-0 w-full h-20 bg-white dark:bg-slate-900 border-t border-slate-100 flex justify-around items-center px-4 pb-2 z-50 rounded-t-[32px] shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
<div class="flex flex-col items-center justify-center text-slate-400">
<span class="material-symbols-outlined mb-1" data-icon="favorite">favorite</span>
<span class="font-['Inter'] text-[11px] font-semibold">Impact</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400">
<span class="material-symbols-outlined mb-1" data-icon="search">search</span>
<span class="font-['Inter'] text-[11px] font-semibold">Explore</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400">
<span class="material-symbols-outlined mb-1" data-icon="chat_bubble">chat_bubble</span>
<span class="font-['Inter'] text-[11px] font-semibold">Messages</span>
</div>
<div class="flex flex-col items-center justify-center bg-[#00A76F]/10 text-[#00A76F] rounded-2xl px-5 py-2">
<span class="material-symbols-outlined mb-1" data-icon="account_circle">account_circle</span>
<span class="font-['Inter'] text-[11px] font-semibold">Profile</span>
</div>
</nav>
