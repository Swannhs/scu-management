<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Quad | University Feed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#006c46",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#6d7a71",
                        "tertiary-fixed": "#ffdad8",
                        "on-surface-variant": "#3d4a41",
                        "secondary-container": "#bceecf",
                        "primary-fixed": "#79fabb",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef0",
                        "surface": "#f8f9fb",
                        "primary-fixed-dim": "#5adda0",
                        "tertiary": "#a33b3c",
                        "on-error-container": "#93000a",
                        "background": "#f8f9fb",
                        "on-error": "#ffffff",
                        "on-primary-container": "#00321f",
                        "inverse-primary": "#5adda0",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#a1d1b4",
                        "secondary-fixed": "#bceecf",
                        "secondary": "#3a674f",
                        "primary": "#006c46",
                        "on-tertiary-fixed-variant": "#842327",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "on-secondary-fixed-variant": "#224f39",
                        "on-secondary-fixed": "#002112",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f8f9fb",
                        "on-primary-fixed": "#002112",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-container": "#406e55",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#005234",
                        "outline-variant": "#bccabf",
                        "on-tertiary-fixed": "#410006",
                        "surface-container-low": "#f2f4f6",
                        "on-background": "#191c1e",
                        "primary-container": "#00a76f",
                        "on-surface": "#191c1e",
                        "tertiary-container": "#e66d6c",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-container": "#5d040f",
                        "surface-container-high": "#e6e8ea"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        h1, h2, h3 {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">menu</span>
<span class="text-xl font-extrabold tracking-tighter text-[#00A76F]">The Quad</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">notifications</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-28 px-4 max-w-md mx-auto">
<!-- Video Post Card -->
<article class="bg-surface-container-lowest rounded-xl shadow-[0_12_32px_rgba(25,28,30,0.04)] overflow-hidden transition-transform duration-200 active:scale-[0.98]">
<!-- Author Row -->
<div class="p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high">
<img alt="Prof. Sarah Chen Profile" class="w-full h-full object-cover" data-alt="Professional portrait of a female faculty member" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-oU6FEjC7Q35OdEKUn0B2shod9u7WqNpRDLhUVBwPA5LEHWgSgWd0m6aon6Cr3icnHOBx0Duffz2MHS-0cVHALGmtWaVpeGi8yTpnBFx_Yr7R_RSXnZWkGFrcVtBtiGbx3fac4i7BKhzXkFtnhIZ43lC2jRaDBhul_PdNOvF70zbMggqL3FsqzaLhsszlLQpyMH0E50zOSk2eF1RluG0ixtCaDc6mOet8QeoNkd7NP1O2QPCs6-i1CSUfXMhbRQndiiqwAWuiGBk-"/>
</div>
<div class="flex flex-col">
<span class="text-sm font-bold font-headline text-on-surface leading-tight">Prof. Sarah Chen</span>
<div class="flex items-center gap-1.5">
<span class="px-2 py-0.5 rounded-full bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-wider">Faculty</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="text-[11px] text-on-surface-variant font-medium">45m ago</span>
</div>
</div>
</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
<!-- Caption -->
<div class="px-4 pb-3">
<p class="text-[14px] leading-relaxed text-on-surface-variant font-body">
                    A quick look at the new robotics lab equipment! <span class="text-primary-container font-semibold">#SCUEngineering</span> <span class="text-primary-container font-semibold">#CampusInnovation</span>
</p>
</div>
<!-- Video Content Area -->
<div class="relative w-full aspect-video bg-surface-container-highest group cursor-pointer overflow-hidden">
<img alt="Robotics Lab Video Thumbnail" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" data-alt="High quality still of a robotic arm in a lab" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCfgxQCv781bPmGvyRVALdGgRJiOKfI6gnW_6wZFl-jsXE71rTf3_iycxD3ZqU7nUKpA2KAF2bzUJmcHyCJKXnbfWCowzZyn9Z9A8i52uFEOdwB0Xu7ZUfx4tFNcJr1nICjlElDss98CAUUnE-1jUgRzOegl5afEucD-7f4Zx-uMozgswqkEE7Qgxewb64VkkIy0sHUmGQsLyw9jjXpG7bdhyFAv5ZkhuKSE0K2wDfc-_NDFa-yqK2vFjPNEyWj9_5elqRQG9z7W_VE"/>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-black/10"></div>
<!-- Play Indicator -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/30 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-white text-4xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<!-- Duration Badge -->
<div class="absolute bottom-3 right-3 px-2 py-1 rounded-lg bg-black/60 backdrop-blur-sm">
<span class="text-[10px] font-bold text-white font-label">0:45</span>
</div>
</div>
<!-- Interaction Row -->
<div class="p-4 flex items-center justify-between">
<div class="flex items-center gap-6">
<!-- Like -->
<button class="flex items-center gap-2 group">
<div class="w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-error/10 transition-colors">
<span class="material-symbols-outlined text-[22px] text-on-surface-variant group-hover:text-error transition-colors">favorite</span>
</div>
<span class="text-xs font-semibold text-on-surface-variant">85</span>
</button>
<!-- Comment -->
<button class="flex items-center gap-2 group">
<div class="w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[22px] text-on-surface-variant group-hover:text-primary-container transition-colors">chat_bubble</span>
</div>
<span class="text-xs font-semibold text-on-surface-variant">12</span>
</button>
<!-- Share -->
<button class="flex items-center gap-2 group">
<div class="w-8 h-8 rounded-full flex items-center justify-center group-hover:bg-secondary-container/20 transition-colors">
<span class="material-symbols-outlined text-[22px] text-on-surface-variant group-hover:text-secondary transition-colors">share</span>
</div>
</button>
</div>
<!-- Bookmark -->
<button class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-[22px] text-on-surface-variant">bookmark</span>
</button>
</div>
</article>
<!-- Placeholder for next card to show feed scroll -->
<article class="mt-4 bg-surface-container-highest/30 h-32 rounded-xl border border-dashed border-outline-variant flex items-center justify-center">
<span class="text-xs text-on-surface-variant/50 font-medium">Scroll for more updates</span>
</article>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-3xl bg-white/90 backdrop-blur-2xl border-t border-slate-100/10 shadow-[0_-4px_24px_rgba(0,0,0,0.04)] flex justify-around items-center h-24 pb-6 px-4">
<!-- Feed (Active) -->
<div class="flex flex-col items-center justify-center text-[#00A76F] bg-[#00A76F]/5 rounded-2xl px-4 py-2 scale-105 active:scale-95 transition-all duration-300 ease-out cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-wider mt-1">Feed</span>
</div>
<!-- Explore -->
<div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-900 transition-colors cursor-pointer">
<span class="material-symbols-outlined">search</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-wider mt-1">Explore</span>
</div>
<!-- Create -->
<div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-900 transition-colors cursor-pointer">
<div class="w-12 h-12 bg-primary-container rounded-2xl flex items-center justify-center shadow-lg -mt-8 mb-1">
<span class="material-symbols-outlined text-white">add</span>
</div>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-wider">Create</span>
</div>
<!-- Inbox -->
<div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-900 transition-colors cursor-pointer">
<span class="material-symbols-outlined">chat_bubble</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-wider mt-1">Inbox</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-900 transition-colors cursor-pointer">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-wider mt-1">Profile</span>
</div>
</nav>
</body></html>
