<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Messages - Community</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006c46",
              "on-background": "#191c1e",
              "surface-bright": "#f8f9fb",
              "surface-variant": "#e0e3e5",
              "on-error": "#ffffff",
              "surface-dim": "#d8dadc",
              "secondary-fixed": "#bceecf",
              "surface-container-lowest": "#ffffff",
              "surface": "#f8f9fb",
              "primary-fixed": "#79fabb",
              "surface-container-high": "#e6e8ea",
              "outline-variant": "#bccabf",
              "error": "#ba1a1a",
              "on-primary-fixed-variant": "#005234",
              "surface-container-highest": "#e0e3e5",
              "on-tertiary-fixed": "#410006",
              "on-surface-variant": "#3d4a41",
              "surface-container-low": "#f2f4f6",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#224f39",
              "on-error-container": "#93000a",
              "inverse-primary": "#5adda0",
              "primary-container": "#00a76f",
              "on-surface": "#191c1e",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#5d040f",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#002112",
              "inverse-surface": "#2d3133",
              "tertiary-container": "#e66d6c",
              "tertiary-fixed": "#ffdad8",
              "on-secondary-fixed": "#002112",
              "secondary-container": "#bceecf",
              "on-primary": "#ffffff",
              "on-tertiary-fixed-variant": "#842327",
              "tertiary-fixed-dim": "#ffb3b0",
              "surface-container": "#eceef0",
              "on-secondary-container": "#406e55",
              "background": "#f8f9fb",
              "tertiary": "#a33b3c",
              "surface-tint": "#006c46",
              "secondary": "#3a674f",
              "inverse-on-surface": "#eff1f3",
              "primary-fixed-dim": "#5adda0",
              "on-primary-container": "#00321f",
              "outline": "#6d7a71",
              "secondary-fixed-dim": "#a1d1b4"
            },
            fontFamily: {
              "headline": ["Public Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        .editorial-headline {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">menu</span>
<h1 class="font-['Public_Sans'] font-bold text-lg tracking-tight text-on-surface">Messages</h1>
</div>
<div class="flex items-center gap-2">
<div class="p-2 transition-opacity hover:opacity-80">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">notifications</span>
</div>
</div>
</div>
</header>
<main class="min-h-screen flex items-center justify-center p-6 pt-16 pb-20">
<!-- Central Empty State Canvas -->
<div class="w-full max-w-md flex flex-col items-center">
<!-- Asymmetrical Decorative Background Element -->
<div class="relative w-full aspect-square flex items-center justify-center mb-10">
<div class="absolute inset-0 bg-primary-container/5 rounded-full blur-3xl scale-110"></div>
<!-- Main Illustration Area -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-48 h-48 bg-white rounded-xl shadow-[0px_12px_32px_rgba(25,28,30,0.04)] flex items-center justify-center relative transition-transform duration-200 scale-102">
<!-- Floating Accent Particles -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-secondary-fixed rounded-lg rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed-variant" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
<div class="absolute -bottom-2 -left-6 w-16 h-16 bg-primary-container/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container">send</span>
</div>
<!-- Core Icon -->
<div class="flex flex-col items-center gap-4">
<span class="material-symbols-outlined text-primary-container text-7xl opacity-90" style="font-variation-settings: 'FILL' 0; font-weight: 200;">forum</span>
</div>
</div>
</div>
</div>
<!-- Content Area -->
<div class="text-center space-y-4 px-4">
<h2 class="editorial-headline text-3xl font-extrabold text-on-surface tracking-tight leading-tight">
                    Your Inbox is Empty
                </h2>
<p class="text-on-surface-variant text-base leading-relaxed max-w-[280px] mx-auto font-medium opacity-80">
                    Connect with students and coordinators to start collaborating on your social service projects.
                </p>
<div class="pt-6">
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary px-10 py-4 rounded-xl font-bold text-base shadow-lg transition-all hover:scale-102 active:scale-95 flex items-center justify-center gap-2 mx-auto">
<span>Find People</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl fixed bottom-0 w-full z-50 rounded-t-2xl shadow-[0px_-12px_32px_rgba(25,28,30,0.04)] border-t border-[#bccabf]/15">
<div class="flex justify-around items-center h-20 pb-safe px-4">
<!-- Feed -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-all hover:text-[#00A76F]">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-['Inter'] text-[11px] font-semibold mt-1">Feed</span>
</div>
<!-- Explore -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-all hover:text-[#00A76F]">
<span class="material-symbols-outlined">search</span>
<span class="font-['Inter'] text-[11px] font-semibold mt-1">Explore</span>
</div>
<!-- Messages (Active) -->
<div class="flex flex-col items-center justify-center text-[#00A76F] bg-[#00A76F]/10 rounded-xl px-4 py-1 scale-95 active:scale-90 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="font-['Inter'] text-[11px] font-semibold mt-1">Messages</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 scale-95 active:scale-90 transition-all hover:text-[#00A76F]">
<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[11px] font-semibold mt-1">Profile</span>
</div>
</div>
</nav>
<!-- Decorative Corner Element -->
<div class="fixed top-20 -right-20 w-40 h-40 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-32 -left-20 w-60 h-60 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none"></div>
</body></html>
