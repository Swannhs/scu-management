<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Campus Social</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00a870",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231c",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col pb-24">
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
<h1 class="text-2xl font-bold tracking-tight">Settings</h1>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-primary/10 transition-colors">
<span class="material-icons-outlined text-slate-600 dark:text-slate-400">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 space-y-6 mt-2">
<!-- Profile Summary -->
<section class="bg-white dark:bg-slate-800/50 p-4 rounded-xl flex items-center gap-4 shadow-sm border border-slate-100 dark:border-slate-800">
<div class="relative">
<img alt="User Profile" class="w-16 h-16 rounded-full object-cover" data-alt="Close up portrait of a smiling student" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOvgUksffT3dp5lBTLIAWevwm8PRoX89SlTzHSvd83rVtJFkXVxXN-d64TAdlHw0QNr-h35nND4zUmUlqIZoDsvRAcGrxMlB25qAKUaGsJSLFrbvUcgqB8mcU5hVhRy8weU2wK0p6wqVV-OIs2Mid8-1rk9aRD6dvc3g8GELHzPobtlVechd7NFKmcN7H6EvzwnS_sQk9VGaXO7SXNKX_gjWezRt3_n8gJcw2E5jpxFy1-VJSSR4RkAgavS25a_IbUUAJ-vjNTM8mD"/>
<div class="absolute bottom-0 right-0 w-4 h-4 bg-primary border-2 border-white dark:border-slate-800 rounded-full"></div>
</div>
<div class="flex-1">
<h2 class="font-semibold text-lg leading-tight">Alex Rivera</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Computer Science, Senior</p>
</div>
<button class="text-primary font-medium text-sm px-3 py-1 rounded-full bg-primary/10">Edit</button>
</section>
<!-- Settings Categories -->
<div class="space-y-2">
<h3 class="px-2 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-3">General</h3>
<div class="bg-white dark:bg-slate-800/50 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800">
<!-- Account -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">person</span>
</div>
<span class="flex-1 text-left font-medium">Account</span>
<span class="material-icons-outlined text-slate-300">chevron_right</span>
</button>
<div class="h-px bg-slate-100 dark:bg-slate-800 mx-4"></div>
<!-- Privacy & Security -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">lock</span>
</div>
<span class="flex-1 text-left font-medium">Privacy &amp; Security</span>
<span class="material-icons-outlined text-slate-300">chevron_right</span>
</button>
<div class="h-px bg-slate-100 dark:bg-slate-800 mx-4"></div>
<!-- Notifications -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">notifications</span>
</div>
<span class="flex-1 text-left font-medium">Notifications</span>
<div class="bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">3</div>
<span class="material-icons-outlined text-slate-300">chevron_right</span>
</button>
</div>
</div>
<div class="space-y-2">
<h3 class="px-2 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-3">Preferences</h3>
<div class="bg-white dark:bg-slate-800/50 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800">
<!-- Dark Mode -->
<div class="flex items-center gap-4 px-4 py-4">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">dark_mode</span>
</div>
<span class="flex-1 text-left font-medium">Dark Mode</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<div class="h-px bg-slate-100 dark:bg-slate-800 mx-4"></div>
<!-- Language -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">translate</span>
</div>
<span class="flex-1 text-left font-medium">Language</span>
<span class="text-sm text-slate-400">English (US)</span>
<span class="material-icons-outlined text-slate-300">chevron_right</span>
</button>
</div>
</div>
<div class="space-y-2">
<h3 class="px-2 text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-3">Support</h3>
<div class="bg-white dark:bg-slate-800/50 rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800">
<!-- Help & Support -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center">
<span class="material-icons-outlined text-primary">help_outline</span>
</div>
<span class="flex-1 text-left font-medium">Help &amp; Support</span>
<span class="material-icons-outlined text-slate-300">chevron_right</span>
</button>
<div class="h-px bg-slate-100 dark:bg-slate-800 mx-4"></div>
<!-- Logout -->
<button class="w-full flex items-center gap-4 px-4 py-4 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors">
<div class="w-10 h-10 rounded-lg bg-red-50 dark:bg-red-900/20 flex items-center justify-center">
<span class="material-icons-outlined text-red-500">logout</span>
</div>
<span class="flex-1 text-left font-medium text-red-500">Logout</span>
</button>
</div>
</div>
<div class="py-6 text-center">
<p class="text-slate-400 dark:text-slate-500 text-xs">Version 2.4.1 (Build 829)</p>
<p class="text-slate-400 dark:text-slate-500 text-[10px] mt-1">© 2024 Campus Social Inc.</p>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-100 dark:border-slate-800 px-6 py-3 flex justify-between items-center z-20">
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-outlined text-slate-400 group-hover:text-primary transition-colors">home</span>
<span class="text-[10px] font-semibold text-slate-400 group-hover:text-primary">Home</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-outlined text-slate-400 group-hover:text-primary transition-colors">explore</span>
<span class="text-[10px] font-semibold text-slate-400 group-hover:text-primary">Campus</span>
</button>
<button class="w-12 h-12 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-primary/30 -mt-8 border-4 border-background-light dark:border-background-dark">
<span class="material-icons-outlined">add</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-icons-outlined text-slate-400 group-hover:text-primary transition-colors">chat_bubble_outline</span>
<span class="text-[10px] font-semibold text-slate-400 group-hover:text-primary">Chat</span>
</button>
<button class="flex flex-col items-center gap-1">
<span class="material-icons-outlined text-primary">person</span>
<span class="text-[10px] font-bold text-primary">Profile</span>
<div class="w-1 h-1 bg-primary rounded-full"></div>
</button>
</nav>
</div>
</body></html>
