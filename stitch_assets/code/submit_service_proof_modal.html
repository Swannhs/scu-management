<!-- TopAppBar -->

<button class="active:scale-95 duration-200 text-emerald-600 dark:text-emerald-400">

<h1 class="text-xl font-black text-emerald-700 dark:text-emerald-500 font-public-sans tracking-tight">EduServe</h1>

<div class="flex items-center gap-3">
<div class="h-8 w-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">

</div>
</div>
</header>
<main class="pt-24 px-5 max-w-md mx-auto space-y-6">
<!-- Status Indicator -->
<div class="flex justify-between items-center">
<h2 class="text-2xl font-bold tracking-tight text-on-surface">Submit Proof</h2>
<span class="bg-primary-fixed text-on-primary-fixed-variant px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Active Session</span>
</div>
<!-- Opportunity Summary Card -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0px_12px_32px_rgba(25,28,30,0.04)] border border-outline-variant/15">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">nature_people</span>
</div>
<div>
<h3 class="text-lg font-bold leading-tight">City Park Restoration</h3>
<p class="text-on-surface-variant text-sm mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-base">calendar_today</span>
                        Oct 24, 2023
                    </p>
<p class="text-on-surface-variant text-sm flex items-center gap-1">
<span class="material-symbols-outlined text-base">person</span>
                        Sarah Jenkins (Coordinator)
                    </p>
</div>
</div>
</div>
<!-- Form Section -->
<form class="space-y-6">
<!-- Hours Input -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface-variant ml-1">Hours worked</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all text-lg font-medium outline-none" placeholder="e.g. 4.5" step="0.5" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium">hours</span>
</div>
</div>
<!-- Upload Area -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface-variant ml-1">Photo evidence</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors group cursor-pointer">
<div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-primary mb-3 shadow-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<p class="text-on-surface font-semibold text-center leading-tight">Upload Photo</p>
<p class="text-on-surface-variant text-xs mt-1">or Drag &amp; Drop</p>
</div>
</div>
<!-- Reflection -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface-variant ml-1">Reflection</label>
<textarea class="w-full bg-surface-container-high border-none rounded-xl p-4 focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all outline-none resize-none" placeholder="What did you learn from this session?" rows="4"></textarea>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-3">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-transform" type="submit">
                    Submit for Verification
                </button>
<button class="w-full border border-outline-variant/30 text-primary font-bold py-4 rounded-xl hover:bg-primary/5 active:scale-95 transition-transform" type="button">
                    Save as Draft
                </button>
</div>
</form>
