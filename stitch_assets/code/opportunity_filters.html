<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Filter Opportunities</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#00a76f",
                        "error": "#ba1a1a",
                        "background": "#f8f9fb",
                        "tertiary-fixed": "#ffdad8",
                        "on-primary": "#ffffff",
                        "outline": "#6d7a71",
                        "secondary-fixed": "#bceecf",
                        "secondary": "#3a674f",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "primary": "#006c46",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#5d040f",
                        "surface-dim": "#d8dadc",
                        "surface-bright": "#f8f9fb",
                        "primary-fixed-dim": "#5adda0",
                        "on-tertiary-fixed": "#410006",
                        "on-secondary-fixed": "#002112",
                        "surface": "#f8f9fb",
                        "on-surface": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "surface-tint": "#006c46",
                        "surface-container-low": "#f2f4f6",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#224f39",
                        "on-error": "#ffffff",
                        "outline-variant": "#bccabf",
                        "tertiary": "#a33b3c",
                        "secondary-fixed-dim": "#a1d1b4",
                        "inverse-surface": "#2d3133",
                        "surface-container": "#eceef0",
                        "on-primary-fixed-variant": "#005234",
                        "on-background": "#191c1e",
                        "on-surface-variant": "#3d4a41",
                        "primary-fixed": "#79fabb",
                        "on-primary-container": "#00321f",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary-container": "#406e55",
                        "inverse-primary": "#5adda0",
                        "on-primary-fixed": "#002112",
                        "tertiary-container": "#e66d6c",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-container": "#bceecf",
                        "on-tertiary-fixed-variant": "#842327"
                    },
                    fontFamily: {
                        "headline": ["Public Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen">
<!-- Bottom Sheet Backdrop -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-sm z-40"></div>
<!-- Main Filter Bottom Sheet Container -->
<main class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest rounded-t-3xl shadow-[0px_-8px_40px_rgba(0,0,0,0.08)] max-h-[813px] flex flex-col overflow-hidden border-none">
<!-- Drag Handle -->
<div class="flex justify-center pt-3 pb-1">
<div class="w-10 h-1.5 bg-surface-variant rounded-full opacity-40"></div>
</div>
<!-- Sticky Header -->
<header class="flex justify-between items-center px-6 py-4">
<h1 class="font-headline font-bold text-2xl tracking-tight text-on-surface">Filter</h1>
<button class="text-primary font-semibold text-sm hover:opacity-80 transition-opacity">Reset</button>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-6 pb-32 hide-scrollbar">
<!-- Category Section -->
<section class="mt-6">
<h2 class="font-headline font-bold text-on-surface mb-4">Category</h2>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-xl bg-primary-container text-on-primary text-sm font-medium transition-all shadow-sm">Environment</button>
<button class="px-4 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-all">Education</button>
<button class="px-4 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-all">Health</button>
<button class="px-4 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-all">Social Welfare</button>
<button class="px-4 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-all">Animal Care</button>
<button class="px-4 py-2 rounded-xl bg-surface-container-low text-on-surface-variant text-sm font-medium hover:bg-surface-container-high transition-all">Arts &amp; Culture</button>
</div>
</section>
<!-- Status Section -->
<section class="mt-10">
<h2 class="font-headline font-bold text-on-surface mb-4">Status</h2>
<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-primary-container/10 group transition-all">
<span class="material-symbols-outlined text-primary mb-2">check_circle</span>
<span class="text-xs font-semibold">Open</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-primary bg-primary-container/10 group transition-all">
<span class="material-symbols-outlined text-primary mb-2" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="text-xs font-semibold text-primary">Urgent</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-primary-container/10 group transition-all">
<span class="material-symbols-outlined text-tertiary mb-2">schedule</span>
<span class="text-xs font-semibold">Closing Soon</span>
</button>
</div>
</section>
<!-- Available Hours Section -->
<section class="mt-10">
<h2 class="font-headline font-bold text-on-surface mb-4">Available Hours</h2>
<div class="flex items-center justify-between gap-3 mb-6">
<button class="flex-1 py-3 px-2 rounded-xl bg-surface-container-low text-on-surface-variant text-xs font-bold text-center border border-outline-variant/10">&lt; 2 hrs</button>
<button class="flex-1 py-3 px-2 rounded-xl bg-primary-container text-on-primary text-xs font-bold text-center shadow-md">2-5 hrs</button>
<button class="flex-1 py-3 px-2 rounded-xl bg-surface-container-low text-on-surface-variant text-xs font-bold text-center border border-outline-variant/10">5+ hrs</button>
</div>
<!-- Custom Range Slider Visual -->
<div class="relative h-12 flex items-center px-2">
<div class="w-full h-1.5 bg-surface-container-highest rounded-full"></div>
<div class="absolute left-1/4 right-1/4 h-1.5 bg-primary-container rounded-full"></div>
<div class="absolute left-1/4 -translate-x-1/2 w-6 h-6 bg-white border-2 border-primary-container rounded-full shadow-lg"></div>
<div class="absolute right-1/4 translate-x-1/2 w-6 h-6 bg-white border-2 border-primary-container rounded-full shadow-lg"></div>
</div>
<div class="flex justify-between text-[10px] font-bold text-on-surface-variant/60 uppercase tracking-widest px-2">
<span>Min 1 hr</span>
<span>Max 20 hrs</span>
</div>
</section>
<!-- Location Section -->
<section class="mt-10">
<h2 class="font-headline font-bold text-on-surface mb-4">Location</h2>
<div class="space-y-3">
<label class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low border border-transparent cursor-pointer hover:bg-surface-container-high transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">apartment</span>
<span class="font-medium">Campus-wide</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">distance</span>
<span class="font-medium">Remote</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</label>
<label class="flex items-center justify-between p-4 rounded-xl border border-outline-variant/30 cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">account_tree</span>
<span class="font-medium">Specific Departments</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant"></div>
</label>
</div>
</section>
<!-- Date Range Section -->
<section class="mt-10">
<h2 class="font-headline font-bold text-on-surface mb-4">Date Range</h2>
<div class="flex overflow-x-auto gap-2 hide-scrollbar py-1">
<button class="whitespace-nowrap px-6 py-2 rounded-full border border-primary text-primary font-bold text-sm bg-primary/5">Today</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full border border-outline-variant/30 text-on-surface-variant font-medium text-sm hover:bg-surface-container-low">This Week</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full border border-outline-variant/30 text-on-surface-variant font-medium text-sm hover:bg-surface-container-low">This Month</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full border border-outline-variant/30 text-on-surface-variant font-medium text-sm hover:bg-surface-container-low">Pick Date</button>
</div>
<!-- Mini Calendar Preview Area -->
<div class="mt-6 bg-surface-container-low rounded-2xl p-4">
<div class="flex justify-between items-center mb-4">
<span class="font-headline font-bold text-sm">October 2023</span>
<div class="flex gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-lg">chevron_left</span>
<span class="material-symbols-outlined text-on-surface-variant text-lg">chevron_right</span>
</div>
</div>
<div class="grid grid-cols-7 gap-y-2 text-center text-[10px] font-bold text-on-surface-variant/40">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
</div>
<div class="grid grid-cols-7 gap-y-2 text-center mt-2">
<span class="text-xs font-medium py-1">23</span>
<span class="text-xs font-bold py-1 bg-primary text-on-primary rounded-lg shadow-sm">24</span>
<span class="text-xs font-medium py-1">25</span>
<span class="text-xs font-medium py-1">26</span>
<span class="text-xs font-medium py-1">27</span>
<span class="text-xs font-medium py-1">28</span>
<span class="text-xs font-medium py-1">29</span>
</div>
</div>
</section>
</div>
<!-- Sticky Footer Action -->
<footer class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest to-transparent pt-12">
<button class="w-full bg-primary-container text-on-primary font-headline font-bold py-4 rounded-xl shadow-[0px_8px_20px_rgba(0,167,111,0.25)] hover:scale-[1.02] active:scale-[0.98] transition-all">
                Apply Filters
            </button>
</footer>
</main>
<!-- Background Content Simulation (Locked) -->
<div class="px-6 py-8 pointer-events-none opacity-40">
<div class="flex justify-between items-center mb-8">
<div class="w-12 h-12 rounded-full bg-surface-variant"></div>
<div class="w-32 h-6 bg-surface-variant rounded-full"></div>
<div class="w-10 h-10 rounded-xl bg-surface-variant"></div>
</div>
<div class="space-y-6">
<div class="h-64 bg-surface-container-high rounded-3xl w-full"></div>
<div class="h-40 bg-surface-container-low rounded-3xl w-full"></div>
</div>
</div>
</body></html>
