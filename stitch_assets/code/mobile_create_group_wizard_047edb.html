<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Group - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00a870",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231c",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex h-auto min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Create New Group</h2>
</div>
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-2 w-2 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/20"></div>
</div>
<div class="px-4">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight pb-2 pt-5">Group Details</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Step 1 of 4: Basic Information</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6 px-4 py-3">
<!-- Group Name -->
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">Group Name</p>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-slate-800/50 h-14 placeholder:text-slate-400 p-[15px] text-base font-normal" placeholder="Enter your campus group name" value=""/>
</label>
<!-- Description -->
<label class="flex flex-col w-full">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal pb-2">Description</p>
<textarea class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-primary/20 bg-white dark:bg-slate-800/50 min-h-32 placeholder:text-slate-400 p-[15px] text-base font-normal leading-normal" placeholder="What is this group about? (e.g. goals, activities)"></textarea>
</label>
<!-- Privacy Settings (Toggle Cards) -->
<div class="flex flex-col gap-3">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal">Privacy Settings</p>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-start p-4 border-2 border-primary bg-primary/5 rounded-xl text-left">
<span class="material-symbols-outlined text-primary mb-2">public</span>
<span class="font-bold text-slate-900 dark:text-slate-100">Public</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Anyone can join and see posts</span>
</button>
<button class="flex flex-col items-start p-4 border border-primary/10 bg-white dark:bg-slate-800/50 rounded-xl text-left">
<span class="material-symbols-outlined text-slate-400 mb-2">lock</span>
<span class="font-bold text-slate-900 dark:text-slate-100">Private</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Approval required to join</span>
</button>
</div>
</div>
<!-- Cover Photo Upload -->
<div class="flex flex-col gap-2">
<p class="text-slate-800 dark:text-slate-200 text-base font-medium leading-normal">Cover Photo</p>
<div class="relative w-full aspect-video rounded-xl border-2 border-dashed border-primary/30 bg-primary/5 flex flex-col items-center justify-center cursor-pointer hover:bg-primary/10 transition-colors">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-4xl mb-2">add_a_photo</span>
<p class="text-sm font-medium text-primary">Upload Group Cover</p>
<p class="text-xs text-slate-400 mt-1">Recommended size: 1200x675</p>
</div>
<img class="absolute inset-0 w-full h-full object-cover rounded-xl opacity-20 pointer-events-none" data-alt="University campus students studying outdoors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDSfUFcoIzB2DjI9eA8dDNhDAgrryKDJm1NnnMV4Xn9WLxKWTha-FbJ_dRP0WTjAqRZMN5M3CoKIniavPt1G0uJ8409iyjTz3XbTTohaVHeS8OQ11l0Opf2K4hfKEJTdQyiu74om5HW5hmbsBiuzvseCAeqnraW6P20CFGLOS5-zmmzqXtAsxLWqTBlQWxfpahw-PF-zM_9vwR5ecznJ-MEzC3xwrex_3tmoR08VXtzCKiZ4eIVpNO_f1UK2lfcFNQfwkOXjfEOBu6c"/>
</div>
</div>
</div>
<!-- Footer Button -->
<div class="mt-auto p-4 pb-10">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>Continue</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</div>
<!-- Spacer for scroll -->
<div class="h-4"></div>
</div>
</body></html>
