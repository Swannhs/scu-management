version: '3.8'

services:
  # PostgreSQL Databases for each service
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  academic-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: academicdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - academic_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  student-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - student_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  attendance-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: attendancedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - attendance_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  examination-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: examinationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5437:5432"
    volumes:
      - examination_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  fee-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: feedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - fee_db_data:/var/lib/postgresql/data
    networks:
      - university-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - university-network

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3001
      - ACADEMIC_SERVICE_URL=http://academic-service:3002
      - STUDENT_SERVICE_URL=http://student-service:3003
      - ATTENDANCE_SERVICE_URL=http://attendance-service:3004
      - EXAMINATION_SERVICE_URL=http://examination-service:3005
      - FEE_SERVICE_URL=http://fee-service:3006
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - redis
      - user-service
    networks:
      - university-network

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@user-db:5432/userdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRATION=24h
    depends_on:
      - user-db
    networks:
      - university-network

  # Academic Service
  academic-service:
    build:
      context: ./services/academic-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@academic-db:5432/academicdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - academic-db
    networks:
      - university-network

  # Student Service
  student-service:
    build:
      context: ./services/student-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@student-db:5432/studentdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - student-db
    networks:
      - university-network

  # Attendance Service
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@attendance-db:5432/attendancedb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - attendance-db
    networks:
      - university-network

  # Examination Service
  examination-service:
    build:
      context: ./services/examination-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@examination-db:5432/examinationdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - examination-db
    networks:
      - university-network

  # Fee Service
  fee-service:
    build:
      context: ./services/fee-service
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@fee-db:5432/feedb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - fee-db
    networks:
      - university-network

volumes:
  user_db_data:
  academic_db_data:
  student_db_data:
  attendance_db_data:
  examination_db_data:
  fee_db_data:

networks:
  university-network:
    driver: bridge
