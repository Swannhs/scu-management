<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Precision Atrium - Admin Portal Login</title>
<!-- Fonts: Public Sans and Inter -->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary-fixed-variant": "#005234",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#00497a",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#191c1e",
                      "tertiary": "#0062a0",
                      "surface-dim": "#d8dadc",
                      "secondary-fixed": "#cbe6fc",
                      "surface-container-highest": "#e0e3e5",
                      "surface-bright": "#f8f9fb",
                      "secondary": "#486174",
                      "on-primary-fixed": "#002112",
                      "secondary-container": "#c8e3fa",
                      "surface": "#f8f9fb",
                      "on-error": "#ffffff",
                      "inverse-primary": "#5adda0",
                      "surface-variant": "#e0e3e5",
                      "surface-container": "#eceef0",
                      "surface-container-low": "#f2f4f6",
                      "tertiary-container": "#4697e0",
                      "surface-tint": "#006c46",
                      "secondary-fixed-dim": "#b0cae0",
                      "primary-fixed": "#79fabb",
                      "on-secondary-container": "#4c6679",
                      "primary-fixed-dim": "#5adda0",
                      "on-secondary-fixed-variant": "#304a5c",
                      "error": "#ba1a1a",
                      "on-primary-container": "#00321f",
                      "on-secondary-fixed": "#011e2e",
                      "inverse-surface": "#2d3133",
                      "outline-variant": "#bccabf",
                      "on-error-container": "#93000a",
                      "surface-container-high": "#e6e8ea",
                      "primary-container": "#00a76f",
                      "background": "#f8f9fb",
                      "primary": "#006c46",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "on-surface-variant": "#3d4a41",
                      "tertiary-fixed": "#d0e4ff",
                      "outline": "#6d7a71",
                      "inverse-on-surface": "#eff1f3",
                      "error-container": "#ffdad6",
                      "tertiary-fixed-dim": "#9bcaff",
                      "on-tertiary-fixed": "#001d35",
                      "on-tertiary-container": "#002d4e",
                      "on-background": "#191c1e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Public Sans"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .bg-pattern {
            background-image: radial-gradient(#bccabf 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.2;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar Shell Implementation -->
<header class="w-full top-0 sticky bg-[#f8f9fb] dark:bg-[#121416] flex justify-between items-center h-16 px-6 z-50">
<div class="flex items-center gap-2">
<span class="text-xl font-bold text-[#006c46] dark:text-[#00a76f] tracking-tighter font-headline">Precision Atrium</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 cursor-pointer active:scale-95 duration-200 hover:bg-[#eceef0] dark:hover:bg-[#2c2e30] transition-colors rounded-full">
<span class="material-symbols-outlined text-[#191c1e] dark:text-[#e1e2e4]">help_outline</span>
</button>
<button class="p-2 cursor-pointer active:scale-95 duration-200 hover:bg-[#eceef0] dark:hover:bg-[#2c2e30] transition-colors rounded-full">
<span class="material-symbols-outlined text-[#191c1e] dark:text-[#e1e2e4]">dark_mode</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center relative px-4 py-12">
<!-- Background Architectural Pattern -->
<div class="absolute inset-0 bg-pattern pointer-events-none"></div>
<!-- Login Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 md:p-10 z-10 shadow-[0_24px_40px_-15px_rgba(25,28,30,0.06)] ring-1 ring-outline-variant/10">
<!-- Branding & Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-container/10 mb-6">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="text-3xl font-headline font-bold text-on-surface tracking-tight mb-2">Admin Portal Login</h1>
<p class="text-on-surface-variant font-body text-sm">Access the Precision Atrium management suite</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Username/Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1 font-label">Email or Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/30 focus:bg-surface-container-lowest transition-all duration-200" placeholder="admin@atrium.edu" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1 font-label">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/30 focus:bg-surface-container-lowest transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between text-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary/20" type="checkbox"/>
<span class="text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 transition-all" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-lg shadow-primary/10 hover:opacity-95 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-xl">login</span>
</button>
</form>
<!-- Secondary Footer Logic -->
<div class="mt-8 text-center">
<p class="text-sm text-on-surface-variant">
                    Internal System Access Only. 
                    <a class="text-primary hover:underline" href="#">Need help?</a>
</p>
</div>
</div>
<!-- Optional Decorative Image/Graphic (Asymmetric Element) -->
<div class="hidden lg:block absolute left-12 bottom-12 max-w-xs opacity-50">
<div class="p-6 bg-surface-container-high/40 backdrop-blur-xl rounded-2xl border border-white/20">
<p class="text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2">System Status</p>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse shadow-[0_0_8px_rgba(0,108,70,0.6)]"></div>
<p class="text-sm font-semibold text-on-surface">All Nodes Operational</p>
</div>
</div>
</div>
</main>
<!-- Footer Implementation -->
<footer class="w-full mt-auto bg-[#f2f4f6] dark:bg-[#1a1c1e] flex flex-col md:flex-row justify-between items-center py-8 px-12 text-[#44474a] dark:text-[#c4c7ca] font-['Inter'] text-sm">
<div class="mb-4 md:mb-0">
            © 2024 Precision Atrium Library Systems
        </div>
<div class="flex gap-8">
<a class="hover:text-[#006c46] dark:hover:text-[#00a76f] transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="hover:text-[#006c46] dark:hover:text-[#00a76f] transition-colors cursor-pointer" href="#">Terms of Service</a>
<a class="hover:text-[#006c46] dark:hover:text-[#00a76f] transition-colors cursor-pointer" href="#">System Status</a>
</div>
</footer>
</body></html>
